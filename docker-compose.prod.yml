services:
  database:
    ports: !reset []

  backend:
    build: !reset null
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_LEVEL: warning
    ports: !override
      - "${BACKEND_PORT:-8001}:8000"

  frontend:
    build: !reset null
    ports: !override
      - "${FRONTEND_PORT:-8081}:80"

