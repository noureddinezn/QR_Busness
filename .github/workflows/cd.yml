name: CD

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: read

env:
  FRONTEND_IMAGE: noureddine10/qr-profile-frontend
  BACKEND_IMAGE: noureddine10/qr-profile-backend

jobs:
  verify:
    name: Verify Before Deploy
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: qr_profile_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d qr_profile_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm run test --if-present

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, pgsql, mbstring, zip
          coverage: none

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare backend test environment
        working-directory: backend
        env:
          APP_ENV: testing
          APP_DEBUG: true
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: qr_profile_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          SESSION_DRIVER: file
          CACHE_STORE: file
          QUEUE_CONNECTION: sync
          AI_PROVIDER: local
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          php artisan migrate --force --ansi
          php artisan test --ansi

  build-and-push:
    name: Build And Push Docker Images
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_PUBLIC_APP_URL=${{ secrets.VITE_PUBLIC_APP_URL }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  verify-images:
    name: Verify Published Image Architectures
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check runnable AMD64 and ARM64 manifests
        env:
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          for image in "$FRONTEND_IMAGE" "$BACKEND_IMAGE"; do
            target="$image:$IMAGE_TAG"
            docker buildx imagetools inspect "$target"
            manifest=$(docker buildx imagetools inspect --raw "$target")

            for arch in amd64 arm64; do
              if ! jq -e --arg arch "$arch" '
                any(.manifests[]?;
                  .platform.os == "linux" and
                  .platform.architecture == $arch and
                  (.mediaType == "application/vnd.oci.image.manifest.v1+json" or
                   .mediaType == "application/vnd.docker.distribution.manifest.v2+json") and
                  (.annotations["vnd.docker.reference.type"] != "attestation-manifest")
                )
              ' <<< "$manifest" > /dev/null; then
                echo "::error::$target is missing a runnable linux/$arch manifest."
                exit 1
              fi
            done
          done

  deploy:
    name: Deploy To Oracle VPS
    runs-on: ubuntu-latest
    needs: verify-images

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,FRONTEND_IMAGE,BACKEND_IMAGE

          script: |
            set -e

            DEPLOY_DIR="/home/ubuntu/QR_Busness"

            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "Deployment directory $DEPLOY_DIR does not exist on VPS."
              exit 1
            fi

            cd "$DEPLOY_DIR"

            export FRONTEND_IMAGE BACKEND_IMAGE

            echo "Logging in to Docker Hub..."
            printf '%s' "$DOCKERHUB_TOKEN" | docker login \
              -u "$DOCKERHUB_USERNAME" \
              --password-stdin

            echo "Pulling new Docker images..."
            FRONTEND_IMAGE="$FRONTEND_IMAGE" \
            BACKEND_IMAGE="$BACKEND_IMAGE" \
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              pull

            echo "Starting updated containers..."
            FRONTEND_IMAGE="$FRONTEND_IMAGE" \
            BACKEND_IMAGE="$BACKEND_IMAGE" \
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              up -d --no-build --wait --wait-timeout 180

            echo "Running Laravel migrations..."
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              exec -T backend php artisan migrate --force

            echo "Caching Laravel configuration..."
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              exec -T backend php artisan config:cache

            echo "Caching Laravel views..."
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              exec -T backend php artisan view:cache

            echo "Deployment status:"
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              ps

            echo "Cleaning unused Docker images..."
            docker image prune -f
